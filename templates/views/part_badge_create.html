{{$b := index .Data "badge"}}

<form class="flex flex-wrap gap-3" novalidate>
  <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
  <div class="prose col-span-full">
    <h2>Neuen Badge erstellen</h2>
  </div>

  <label class="form-control w-full">
    <div class="label">
      <span class="label-text">Nummer <span class="text-error font-extrabold">*</span></span>
    </div>
    <input type="text" placeholder="Badge Nummer"
      class='input input-bordered w-full {{with .Form.Errors.Get "number"}} input-error {{end}}' value="{{ $b.Number }}"
      name="number" required />
    {{with .Form.Errors.Get "number"}}
    <div class="label">
      <span class="label-text text-error">{{.}}</span>
    </div>
    {{end}}
  </label>

  <div class="flex w-full gap-3 items-end">
    <label id="badge" class="form-control w-full">
      <div class="label">
        <span class="label-text">UUID <span class="text-error font-extrabold">*</span>
        </span>
      </div>
      <input type="text" placeholder="Badge UUID"
        class='input input-bordered w-full {{with .Form.Errors.Get "uid"}} input-error {{end}}' value="{{ $b.UID }}"
        name="uid" required />
      {{with .Form.Errors.Get "uid"}}
      <div class="label">
        <span class="label-text text-error">{{.}}</span>
      </div>
      {{end}}
    </label>

    <div class="btn btn-outline btn-circle btn-secondary" hx-disabled-elt="this" hx-target="#statusMessage"
      onclick="hideMessage()" hx-get="/admin/l4/badges/scan" hx-indicator="#statusMessage,#indicator">
      <span class="i-mdi-nfc-variant text-2xl"></span>
    </div>
  </div>

  <div id="indicator" class="flex htmx-indicator gap-3 items-center">
    <span id="indicator" class="htmx-indicator loading loading-infinity loading-lg"></span><span class="font-bold">Badge
      wird gescannt...</span>
  </div>
  <div id="statusMessage" class="loaded-content">
  </div>

  <div class=" col-span-full text-sm mt-3"><span class="text-error font-extrabold">*</span> diese Felder sind zwingend
    auszufüllen und die Werte dürfen noch nicht vergeben sein.
  </div>

  <div class="col-span-full w-full gap-3 flex mt-3 items-center justify-center flex-col md:flex-row">
    <a class="btn btn-success" hx-post="/admin/l4/badges/create" hx-target="#content">Speichern
    </a>
    <a href="/admin/l3/badges" class="btn btn-warning"><span class="i-mdi-cancel-bold"></span>
      Abbrechen</a>
  </div>
</form>

<script>
  hideMessage = function () {
    document.getElementById("statusMessage").innerHTML = "";
  }
</script>
