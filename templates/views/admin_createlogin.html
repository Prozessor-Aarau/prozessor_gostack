{{template "base_nonav" .}}

{{define "content"}}
{{$vis := index .Data "visitor"}}
{{$err := index .Data "error"}}
<!-- Login Form -->
<div class="prose p-4 container mx-auto flex flex-col gap-2 w-11/12 max-w-4xl">
  <h2 class="mx-auto mt-6">Willkommen beim Prozessor {{$vis.FirstName}}</h2>
  <!-- start of Form -->
  <form class="grid grid-cols-1 gap-1 sm:gap-3 overflow-y-auto p-5" method="POST" action="/createlogin" novalidate>
    {{with $err}}
    {{template "errorMessage" $err}}
    {{else}}
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
    <input type="hidden" id="email" name="email" class="grow" value="{{$vis.Email}}" />
    <input type="hidden" id="email" name="first_name" class="grow" value="{{$vis.FirstName}}" />
    <input type="hidden" id="email" name="family_name" class="grow" value="{{$vis.FamilyName}}" />
    <label class="form-control col-span-4 md:col-span-2">
      <div class="label">
        <span class="label-text">Passwort ändern</span>
      </div>
      <input type="password" name="password" id="password"
        class='input input-bordered {{with .Form.Errors.Get "password"}} input-error {{end}}'>
      {{with .Form.Errors.Get "password"}}
      <div class="label">
        <span class="label-text text-error">{{.}}</span>
      </div>
      {{end}}
    </label>
    <label class="form-control col-span-4 md:col-span-2">
      <div class="label">
        <span class="label-text">neues Passwort wiederholen</span>
      </div>
      <input type="password" name="password_check" id="password_check"
        class='input input-bordered {{with .Form.Errors.Get "password_check"}} input-error {{end}}'>
      {{with .Form.Errors.Get "password_check"}}
      <div class="label">
        <span class="label-text text-error">{{.}}</span>
      </div>
      {{end}}
    </label>
    <input type="submit" class="btn btn-secondary mt-6" value="Create Login">
    {{end}}

  </form>
</div>
{{end}}
